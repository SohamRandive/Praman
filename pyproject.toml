[project]
name = "praman"
version = "0.1.0"
description = "Chargeback defense: decide, assemble evidence, detect rings, draft grounded representments."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["slow: trains a model; excluded with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
